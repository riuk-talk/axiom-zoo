name: Build AXIOM Zoo Android APK
# Android build on current main; include actionable diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates openjdk-17-jdk-headless
          python3 --version
          java -version
          keytool -help >/dev/null
      - name: Install Godot 4.4 Android SDK components
        run: |
          set -eu
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
      - name: Install matching Godot Android export templates
        run: |
          set -eu
          mkdir -p /tmp/axiom-templates
          python3 - <<'PY'
          import urllib.request
          url = "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          urllib.request.urlretrieve(url, "/tmp/axiom-templates/templates.tpz")
          PY
          python3 - <<'PY'
          import zipfile, os, shutil
          src = "/tmp/axiom-templates/templates.tpz"
          dest = os.path.expanduser("~/.local/share/godot/export_templates/4.4.1.stable")
          os.makedirs(dest, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              for name in ("android_debug.apk", "android_release.apk", "version.txt"):
                  candidate = "templates/" + name
                  if candidate in z.namelist():
                      with z.open(candidate) as r, open(os.path.join(dest, name), "wb") as w:
                          shutil.copyfileobj(r, w)
          print("Templates:", os.listdir(dest))
          PY
      - name: Configure Android Java SDK and debug signing
        run: |
          set -eu
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=AXIOM,C=FR"
          {
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
            printf 'export/android/debug_keystore = "%s/.android/debug.keystore"\n' "$HOME"
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n'
            printf 'export/android/debug_keystore_pass = "android"\n'
          } > "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Check Godot project and environment
        run: |
          set -eu
          pwd
          ls -la
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scripts/main.gd
          godot --headless --path . --editor --quit
          echo "=== Android SDK signing and packaging checks ==="
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Diagnose Android export preset directly
        run: |
          set -eu
          cat > /tmp/axiom_export_diagnostic.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              print("=== GODOT EXPORT PRESET VALIDATION ===")
              print("Export platform count: ", EditorExport.get_export_platform_count())
              print("Export preset count: ", EditorExport.get_export_preset_count())
              for i in range(EditorExport.get_export_preset_count()):
                  var preset = EditorExport.get_export_preset(i)
                  var platform = preset.get_platform()
                  var errors = [""]
                  var missing_templates = [false]
                  var ok = platform.can_export(preset, errors, missing_templates)
                  print("PRESET: ", preset.get_name(), " PLATFORM: ", platform.get_name())
                  print("CAN_EXPORT: ", ok, " MISSING_TEMPLATES: ", missing_templates[0])
                  print("ERROR_DETAILS: ", errors[0])
              quit()
          GDSCRIPT
          godot --headless --editor --path . --script /tmp/axiom_export_diagnostic.gd
      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -eu
          mkdir -p build
          echo "=== Android SDK installed components ==="
          ls -la "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/cmdline-tools" || true
          echo "=== Java and SDK paths ==="
          echo "JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
          echo "=== Godot export detailed diagnostics ==="
          godot --verbose --headless --path . --export-debug "Android" build/AXIOM-Zoo-debug.apk
          test -s build/AXIOM-Zoo-debug.apk
          ls -lh build/AXIOM-Zoo-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-Zoo-Android-debug
          path: build/AXIOM-Zoo-debug.apk
          if-no-files-found: error
